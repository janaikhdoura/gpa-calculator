<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة المعدل التراكمي والفصلي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>حاسبة المعدل الجامعي</h1>
            <p class="subtitle">احسب معدل الفصل والمعدل التراكمي بسهولة</p>
        </header>

        <main>
            <!-- Navigation Tabs -->
            <div class="tabs-container">
                <button class="tab-btn active" data-tab="semester">معدل الفصل</button>
                <button class="tab-btn" data-tab="cumulative">المعدل التراكمي</button>
            </div>

            <!-- Semester GPA Tab -->
            <div id="semester" class="tab-content active">
                <div class="courses-section">
                    <h2>المقررات الدراسية</h2>
                    
                    <div class="add-course-form">
                        <div class="form-group">
                            <label for="courseName">اسم المقرر</label>
                            <input type="text" id="courseName" placeholder="مثال: الرياضيات 101">
                        </div>
                        
                        <div class="form-group">
                            <label for="creditHours">الساعات المعتمدة</label>
                            <input type="number" id="creditHours" placeholder="3" min="1" max="6">
                        </div>
                        
                        <div class="form-group">
                            <label for="gradeSelect">التقدير</label>
                            <select id="gradeSelect">
                                <option value="">اختر التقدير</option>
                                <option value="4.0">A+ (4.0)</option>
                                <option value="4.0">A (4.0)</option>
                                <option value="3.7">A- (3.7)</option>
                                <option value="3.3">B+ (3.3)</option>
                                <option value="3.0">B (3.0)</option>
                                <option value="2.7">B- (2.7)</option>
                                <option value="2.3">C+ (2.3)</option>
                                <option value="2.0">C (2.0)</option>
                                <option value="1.7">C- (1.7)</option>
                                <option value="1.3">D+ (1.3)</option>
                                <option value="1.0">D (1.0)</option>
                                <option value="0.0">F (0.0)</option>
                            </select>
                        </div>
                        
                        <button id="addCourseBtn" class="btn btn-primary">إضافة مقرر</button>
                    </div>
                </div>

                <div class="courses-list-section">
                    <h2>قائمة المقررات</h2>
                    <table id="coursesTable" class="courses-table">
                        <thead>
                            <tr>
                                <th>اسم المقرر</th>
                                <th>الساعات</th>
                                <th>التقدير</th>
                                <th>النقاط</th>
                                <th>الحذف</th>
                            </tr>
                        </thead>
                        <tbody id="coursesBody">
                        </tbody>
                    </table>
                    <p id="emptyMessage" class="empty-message">لا توجد مقررات مضافة حتى الآن</p>
                </div>

                <div class="results-section">
                    <div class="result-card">
                        <div class="result-item">
                            <label>إجمالي الساعات المعتمدة:</label>
                            <p id="totalCredits" class="result-value">0</p>
                        </div>
                        <div class="result-item">
                            <label>إجمالي النقاط:</label>
                            <p id="totalPoints" class="result-value">0.0</p>
                        </div>
                    </div>

                    <div class="gpa-card">
                        <label>معدل الفصل الدراسي (GPA):</label>
                        <p id="gpaResult" class="gpa-value">0.00</p>
                    </div>

                    <div class="button-group">
                        <button id="calculateBtn" class="btn btn-success">احسب المعدل</button>
                        <button id="resetBtn" class="btn btn-danger">حذف الكل</button>
                    </div>
                </div>
            </div>

            <!-- Cumulative GPA Tab -->
            <div id="cumulative" class="tab-content">
                <div class="cgpa-section">
                    <h2>حساب المعدل التراكمي</h2>
                    
                    <div class="cgpa-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="prevGPA">المعدل التراكمي السابق</label>
                                <input type="number" id="prevGPA" placeholder="3.5" min="0" max="4" step="0.01">
                            </div>
                            
                            <div class="form-group">
                                <label for="prevCredits">الساعات المعتمدة السابقة</label>
                                <input type="number" id="prevCredits" placeholder="45" min="0" step="1">
                            </div>
                        </div>

                        <div class="divider-line"></div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="currentGPA">معدل الفصل الحالي</label>
                                <input type="number" id="currentGPA" placeholder="3.8" min="0" max="4" step="0.01">
                            </div>
                            
                            <div class="form-group">
                                <label for="currentCredits">ساعات الفصل الحالي</label>
                                <input type="number" id="currentCredits" placeholder="15" min="0" step="1">
                            </div>
                        </div>

                        <button id="calculateCGPABtn" class="btn btn-success btn-large">احسب المعدل التراكمي</button>
                    </div>
                </div>

                <div class="cgpa-results-section">
                    <div class="cgpa-result-card">
                        <div class="cgpa-result-item">
                            <label>إجمالي الساعات:</label>
                            <p id="totalAllCredits" class="cgpa-result-value">0</p>
                        </div>
                        <div class="cgpa-result-item">
                            <label>إجمالي النقاط:</label>
                            <p id="totalAllPoints" class="cgpa-result-value">0.0</p>
                        </div>
                    </div>

                    <div class="cgpa-card">
                        <label>المعدل التراكمي الجديد (CGPA):</label>
                        <p id="cgpaResult" class="cgpa-value">0.00</p>
                    </div>

                    <button id="resetCGPABtn" class="btn btn-danger btn-large">إعادة تعيين</button>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2024 حاسبة المعدل الجامعي | جميع الحقوق محفوظة</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
